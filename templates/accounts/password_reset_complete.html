{% extends 'base.html' %}

{% block title %}Parol o'zgartirildi{% endblock %}

{% block content %}
<div class="main-content no-sidebar">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm mt-4">
                    <div class="card-body p-4 text-center">
                        <div class="bg-success bg-opacity-10 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-check-circle fs-1 text-success"></i>
                        </div>
                        <h4 class="fw-bold">Parol muvaffaqiyatli o'zgartirildi!</h4>
                        <p class="text-muted">
                            Yangi parolingiz bilan tizimga kirishingiz mumkin.
                        </p>
                        <a href="{% url 'login' %}" class="btn btn-primary mt-2 px-4 py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Kirish
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
